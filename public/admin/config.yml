backend:
  name: github
  repo: youjunhui-sky/jinko-rebuild
  branch: main
  base_url: https://jinko-cms-oauth.youjh120608.workers.dev
  auth_endpoint: oauth/auth

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://jinko-rebuild.youjh120608.workers.dev
display_url: https://jinko-rebuild.youjh120608.workers.dev
logo_url: /logo.svg
locale: "en"
publish_mode: editorial_workflow

collections:
  - name: "homepage"
    label: "🏠 Homepage"
    folder: "src/content/homepage"
    create: false
    delete: false
    format: "json"
    extension: "json"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Internal Title", widget: "string" }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string" }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }
      - label: "Hero"
        name: "hero"
        widget: "object"
        fields:
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Hero Title", widget: "string" }
          - { name: "description", label: "Hero Description", widget: "text" }
          - { name: "image", label: "Hero Image", widget: "image", default: "/placeholders/battery-system.svg" }
          - { name: "imageAlt", label: "Hero Image Alt", widget: "string", required: false }
          - { name: "primaryCtaLabel", label: "Primary CTA Label", widget: "string", default: "Explore Products" }
          - { name: "primaryCtaHref", label: "Primary CTA URL", widget: "string", default: "/products" }
          - { name: "secondaryCtaLabel", label: "Secondary CTA Label", widget: "string", default: "View System Packages" }
          - { name: "secondaryCtaHref", label: "Secondary CTA URL", widget: "string", default: "/solutions" }
          - { name: "tertiaryCtaLabel", label: "Tertiary CTA Label", widget: "string", default: "Request Quote" }
          - { name: "tertiaryCtaHref", label: "Tertiary CTA URL", widget: "string", default: "/contact" }
          - { name: "floatingEyebrow", label: "Floating Card Eyebrow", widget: "string", required: false }
          - { name: "floatingTitle", label: "Floating Card Title", widget: "string", required: false }
          - { name: "floatingDescription", label: "Floating Card Description", widget: "text", required: false }
      - label: "Stats"
        name: "stats"
        widget: "list"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "value", label: "Value", widget: "string" }
      - label: "Why Callsun Section"
        name: "why"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - { name: "title", label: "Card Title", widget: "string" }
              - { name: "description", label: "Card Description", widget: "text" }
      - label: "Products Section"
        name: "productsSection"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
      - label: "Solutions Section"
        name: "solutionsSection"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
          - { name: "linkLabel", label: "Link Label", widget: "string", required: false }
          - { name: "linkHref", label: "Link URL", widget: "string", required: false }
      - label: "Cases Section"
        name: "casesSection"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
          - { name: "linkLabel", label: "Link Label", widget: "string", required: false }
          - { name: "linkHref", label: "Link URL", widget: "string", required: false }
      - label: "SEO / SEM Section"
        name: "marketingSection"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
          - { name: "checklist", label: "Checklist", widget: "list", default: [] }
      - label: "Resources Section"
        name: "resourcesSection"
        widget: "object"
        fields:
          - { name: "visible", label: "Visible", widget: "boolean", default: true }
          - { name: "eyebrow", label: "Eyebrow", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "linkLabel", label: "Link Label", widget: "string", required: false }
          - { name: "linkHref", label: "Link URL", widget: "string", required: false }

  - name: "navigation"
    label: "🧭 Navigation"
    folder: "src/content/navigation"
    create: true
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "label"
    summary: "{{order}} · {{label}}"
    sortable_fields: ["order", "label"]
    fields:
      - { name: "label", label: "Navigation Label", widget: "string" }
      - { name: "href", label: "URL", widget: "string", hint: "Use internal paths like /products or full URLs." }
      - { name: "description", label: "Description", widget: "string", required: false }
      - { name: "image", label: "Dropdown Image", widget: "image", required: false }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }
      - { name: "visible", label: "Show in Header", widget: "boolean", default: true }
      - { name: "footerVisible", label: "Show in Footer", widget: "boolean", default: true }
      - label: "Dropdown Children"
        name: "children"
        widget: "list"
        required: false
        summary: "{{order}} · {{label}}"
        fields:
          - { name: "label", label: "Child Label", widget: "string" }
          - { name: "href", label: "Child URL", widget: "string" }
          - { name: "description", label: "Child Description", widget: "string", required: false }
          - { name: "image", label: "Child Image", widget: "image", required: false }
          - { name: "order", label: "Display Order", widget: "number", default: 0 }
          - { name: "visible", label: "Show", widget: "boolean", default: true }

  - name: "products"
    label: "📦 Products"
    folder: "src/content/products"
    create: true
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "name"
    summary: "{{name}} — {{category}}"
    sortable_fields: ["order", "name"]
    fields:
      - { name: "name", label: "Product Name", widget: "string" }
      - { name: "slug", label: "URL Slug", widget: "string" }
      - { name: "category", label: "Category", widget: "select", options: ["standard-module", "custom-module"] }
      - { name: "model", label: "Model", widget: "string", required: false }
      - { name: "tagline", label: "Tagline", widget: "string" }
      - { name: "tech", label: "Technology", widget: "string" }
      - { name: "certifications", label: "Certifications", widget: "list", default: [] }
      - { name: "benefits", label: "Benefits", widget: "list", default: [] }
      - { name: "warranty", label: "Warranty Text", widget: "text", required: false }
      - { name: "relatedSolutions", label: "Related Solution Slugs", widget: "list", default: [] }
      - { name: "relatedCases", label: "Related Case Slugs", widget: "list", default: [] }
      - { name: "image", label: "Product Image", widget: "image", default: "/placeholders/solar-panel.svg" }
      - { name: "imageAlt", label: "Image Alt", widget: "string", required: false }
      - { name: "description", label: "Description", widget: "text" }
      - label: "Specifications"
        name: "specs"
        widget: "list"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "value", label: "Value", widget: "string" }
          - { name: "group", label: "Group", widget: "string", required: false }
      - { name: "applications", label: "Applications", widget: "list", default: [] }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }

  - name: "solutions"
    label: "🔋 Solutions"
    folder: "src/content/solutions"
    create: true
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "URL Slug", widget: "string" }
      - { name: "type", label: "Type", widget: "select", options: ["grid-tied", "off-grid"] }
      - { name: "capacityLabel", label: "Capacity Label", widget: "string" }
      - { name: "pvCapacity", label: "PV Capacity", widget: "string", required: false }
      - { name: "batteryCapacity", label: "Battery Capacity", widget: "string", required: false }
      - { name: "image", label: "Image", widget: "image", default: "/placeholders/battery-system.svg" }
      - { name: "summary", label: "Summary", widget: "text" }
      - label: "Components"
        name: "components"
        widget: "list"
        fields:
          - { name: "category", label: "Category", widget: "string" }
          - { name: "name", label: "Name", widget: "string" }
          - { name: "quantity", label: "Quantity", widget: "string", required: false }
          - { name: "note", label: "Note", widget: "text", required: false }
      - label: "Topology Steps"
        name: "topologySteps"
        widget: "list"
        required: false
        fields:
          - { name: "label", label: "Step Label", widget: "string" }
          - { name: "description", label: "Description", widget: "text", required: false }
      - { name: "benefits", label: "Benefits", widget: "list", default: [] }
      - label: "Downloads"
        name: "downloads"
        widget: "list"
        required: false
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "url", label: "URL", widget: "string" }
      - { name: "relatedCases", label: "Related Case Slugs", widget: "list", default: [] }
      - { name: "useCases", label: "Use Cases", widget: "list", default: [] }
      - { name: "relatedProducts", label: "Related Product Slugs", widget: "list", default: [] }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }

  - name: "applications"
    label: "🏠 Applications"
    folder: "src/content/applications"
    create: true
    delete: true
    format: "json"
    extension: "json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "URL Slug", widget: "string" }
      - { name: "summary", label: "Summary", widget: "text" }
      - { name: "image", label: "Image", widget: "image", default: "/placeholders/case-rooftop.svg" }
      - { name: "recommendedSolutions", label: "Recommended Solution Slugs", widget: "list", default: [] }
      - { name: "relatedProducts", label: "Related Product Slugs", widget: "list", default: [] }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }

  - name: "cases"
    label: "🏗️ Cases"
    folder: "src/content/cases"
    create: true
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "URL Slug", widget: "string" }
      - { name: "client", label: "Client", widget: "string", required: false }
      - { name: "location", label: "Location", widget: "string" }
      - { name: "region", label: "Region", widget: "select", options: ["Domestic", "Overseas"] }
      - { name: "industry", label: "Industry", widget: "string", required: false }
      - { name: "capacityKW", label: "Capacity kW", widget: "number", required: false, value_type: "float" }
      - { name: "capacityMWh", label: "Capacity MWh", widget: "number", required: false, value_type: "float" }
      - { name: "segment", label: "Segment", widget: "select", options: ["Small C&I", "Mid-Scale C&I", "Large C&I", "Solar + Storage"] }
      - { name: "application", label: "Application", widget: "select", options: ["Commercial & Industrial", "Residential", "Municipal", "Solar + Storage"] }
      - { name: "coverImage", label: "Cover Image", widget: "image", default: "/placeholders/case-rooftop.svg" }
      - { name: "gallery", label: "Gallery Images", widget: "list", default: [], field: { name: "image", label: "Image", widget: "image" } }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "projectBackground", label: "Project Background", widget: "text", required: false }
      - { name: "customerPainPoints", label: "Customer Pain Points", widget: "list", default: [] }
      - { name: "solutionOverview", label: "Solution Overview", widget: "text", required: false }
      - { name: "businessResults", label: "Business Results", widget: "list", default: [] }
      - label: "Project Parameters"
        name: "projectParameters"
        widget: "list"
        required: false
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "value", label: "Value", widget: "string" }
      - { name: "salesAngle", label: "Sales Angle", widget: "text", required: false }
      - { name: "casePdf", label: "Case PDF / Download URL", widget: "string", required: false }
      - { name: "relatedProducts", label: "Related Product Slugs", widget: "list", default: [] }
      - { name: "relatedSolutions", label: "Related Solution Slugs", widget: "list", default: [] }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "order", label: "Display Order", widget: "number", default: 0 }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }

  - name: "news"
    label: "📰 Blog"
    folder: "src/content/news"
    create: true
    delete: true
    format: "frontmatter"
    extension: "md"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "publishDate", label: "Publish Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "author", label: "Author", widget: "string", default: "Callsun" }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - { name: "category", label: "Category", widget: "select", options: ["Press", "Product", "Industry", "Technical", "Sustainability"] }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: false }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "landingPages"
    label: "🎯 Landing Pages"
    folder: "src/content/landingPages"
    create: true
    delete: true
    format: "json"
    extension: "json"
    identifier_field: "title"
    fields:
      - { name: "title", label: "Page Title", widget: "string" }
      - { name: "slug", label: "Landing URL Slug", widget: "string", hint: "Example: solar-distributor -> /landing/solar-distributor/" }
      - { name: "audience", label: "Audience", widget: "string" }
      - { name: "campaign", label: "Campaign", widget: "string", required: false }
      - { name: "adGroup", label: "Ad Group", widget: "string", required: false }
      - { name: "targetKeywords", label: "Target Keywords", widget: "list", default: [] }
      - label: "Hero"
        name: "hero"
        widget: "object"
        fields:
          - { name: "eyebrow", label: "Eyebrow", widget: "string", required: false }
          - { name: "title", label: "Hero Title", widget: "string" }
          - { name: "description", label: "Hero Description", widget: "text" }
          - { name: "image", label: "Hero Image", widget: "image", required: false }
          - { name: "imageAlt", label: "Hero Image Alt", widget: "string", required: false }
          - { name: "primaryCtaLabel", label: "Primary CTA Label", widget: "string", default: "Request a Quote" }
          - { name: "primaryCtaHref", label: "Primary CTA URL", widget: "string", default: "#landing-form" }
          - { name: "secondaryCtaLabel", label: "Secondary CTA Label", widget: "string", required: false }
          - { name: "secondaryCtaHref", label: "Secondary CTA URL", widget: "string", required: false }
      - { name: "trustBadges", label: "Trust Badges", widget: "list", default: [] }
      - label: "Pain Points"
        name: "painPoints"
        widget: "list"
        required: false
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text" }
      - label: "Value Props"
        name: "valueProps"
        widget: "list"
        required: false
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text" }
      - label: "Offer Cards"
        name: "offerCards"
        widget: "list"
        required: false
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "text" }
          - { name: "linkLabel", label: "Link Label", widget: "string", required: false }
          - { name: "linkHref", label: "Link URL", widget: "string", required: false }
      - { name: "recommendedProducts", label: "Recommended Product Slugs", widget: "list", default: [], hint: "Use product slug, e.g. 580w-n-type-solar-module" }
      - { name: "recommendedSolutions", label: "Recommended Solution Slugs", widget: "list", default: [] }
      - { name: "relatedCases", label: "Related Case Slugs", widget: "list", default: [] }
      - label: "Downloads"
        name: "downloads"
        widget: "list"
        required: false
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "url", label: "URL", widget: "string" }
      - { name: "formTitle", label: "Form Title", widget: "string", default: "Request campaign pricing" }
      - { name: "formDescription", label: "Form Description", widget: "text", required: false }
      - { name: "thankYouMessage", label: "Thank You / Reserved Message", widget: "text", default: "Inquiry endpoint is reserved for the next CRM phase." }
      - { name: "ctaLabel", label: "Submit Button Label", widget: "string", default: "Request a Quote" }
      - { name: "draft", label: "Draft", widget: "boolean", default: true }
      - { name: "seoTitle", label: "SEO Title", widget: "string", required: false }
      - { name: "metaDescription", label: "Meta Description", widget: "text", required: false }
      - { name: "h1", label: "H1", widget: "string", required: false }
      - { name: "keywords", label: "Keywords", widget: "list", default: [] }
      - { name: "canonical", label: "Canonical URL", widget: "string", required: false }
      - { name: "ogImage", label: "OG Image", widget: "image", required: false }
      - { name: "noindex", label: "Noindex", widget: "boolean", default: true }

  - name: "customPages"
    label: "🧩 Custom Pages"
    folder: "src/content/customPages"
    create: true
    delete: true
    format: "frontmatter"
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Page Title", widget: "string" }
      - { name: "urlPath", label: "URL Slug / Path", widget: "string", hint: "Examples: pages/oem-solar-panels, about/certifications, support/shipping-policy" }
      - { name: "pageType", label: "Page Type", widget: "select", options: ["SEO Page", "Company Page", "Support Page", "Legal Page", "Campaign Page"], default: "SEO Page" }
      - { name: "category", label: "Category Name", widget: "string", required: false }
      - { name: "eyebrow", label: "Eyebrow", widget: "string", required: false }
      - { name: "summary", label: "Summary / Hero Description", widget: "text" }
      - { name: "coverImage", label: "Cover Image", widget: "image", required: false }
      - { name: "imageAlt", label: "Image Alt Text", widget: "string", required: false }
      - { name: "ctaLabel", label: "Primary CTA Label", widget: "string", default: "Request a Quote" }
      - { name: "ctaHref", label: "Primary CTA URL", widget: "string", default: "/contact" }
      - { name: "secondaryCtaLabel", label: "Secondary CTA Label", widget: "string", required: false }
      - { name: "secondaryCtaHref", label: "Secondary CTA URL", widget: "string", required: false }
      - label: "Page Sections / H2-H3 Blocks"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { name: "eyebrow", label: "Section Eyebrow", widget: "string", required: false }
